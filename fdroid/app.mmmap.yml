# F-Droid metadata for Mmmap
#
# This file lives in the fdroiddata repository (https://gitlab.com/fdroid/fdroiddata),
# NOT in the Mmmap source tree.  Copy it there once you have forked fdroiddata.
#
# Before submitting the MR:
#   1. Fill in AllowedAPKSigningKeys (see note below).
#   2. Run: fdroid lint metadata/app.mmmap.yml
#   3. Run: fdroid rewritemeta app.mmmap  (auto-formats fields)
#
# AllowedAPKSigningKeys — get your cert's SHA-256 fingerprint with:
#   keytool -list -v -keystore mmmap-release.jks -alias mmmap \
#       | grep "SHA-256"
# Remove colons from the fingerprint before pasting here.
# This enables the "signed-by-upstream" path: F-Droid verifies its unsigned
# build byte-matches your signed GitHub Release APK, then serves your APK.

