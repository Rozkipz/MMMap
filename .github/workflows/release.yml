name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mmmap-release.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: Write API keys
        env:
          FSQ_API_KEY: ${{ secrets.FSQ_API_KEY }}
        run: |
          echo "fsq.api.key=$FSQ_API_KEY" >> local.properties

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Get changelog
        id: changelog
        run: |
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oP '\d+')
          NOTES_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "notes=$(cat $NOTES_FILE)" >> $GITHUB_OUTPUT
          else
            echo "notes=Release ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: ${{ steps.changelog.outputs.notes }}
