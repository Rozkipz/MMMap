name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Compute version code
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> $GITHUB_OUTPUT

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mmmap-release.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: Write API keys
        env:
          FSQ_API_KEY: ${{ secrets.FSQ_API_KEY }}
        run: echo "fsq.api.key=$FSQ_API_KEY" >> local.properties

      - name: Assemble release APK
        run: just assemble-release ${{ inputs.version }} ${{ steps.ver.outputs.code }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just gh-release ${{ inputs.version }}
