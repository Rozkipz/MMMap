name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Validate version and compute version code
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::version must be MAJOR.MINOR (got '$VERSION')"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 ))" >> $GITHUB_OUTPUT

      - name: Verify gradle.properties matches version
        run: |
          GRADLE_NAME=$(grep "^versionName=" gradle.properties | cut -d= -f2)
          GRADLE_CODE=$(grep "^versionCode=" gradle.properties | cut -d= -f2)
          if [[ "$GRADLE_NAME" != "${{ inputs.version }}" || "$GRADLE_CODE" != "${{ steps.ver.outputs.code }}" ]]; then
            echo "::error::gradle.properties (${GRADLE_NAME}/${GRADLE_CODE}) does not match input (${{ inputs.version }}/${{ steps.ver.outputs.code }}). Run 'just bump-version ${{ inputs.version }}' and commit before triggering this workflow."
            exit 1
          fi

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mmmap-release.jks
          printf 'storeFile=mmmap-release.jks\nstorePassword=%s\nkeyAlias=mmmap\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Assemble release APK
        run: just assemble-release ${{ inputs.version }} ${{ steps.ver.outputs.code }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mmmap-${{ inputs.version }}.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: mmmap-${{ inputs.version }}.apk
          path: app/build/outputs/apk/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just gh-release ${{ inputs.version }} ${{ github.sha }}

  verify-fdroid-reproducibility:
    # Verify the published APK byte-matches what F-Droid's build server
    # will produce, by running fdroid build against the just-tagged
    # commit and the developer-signed APK at the published Binaries URL.
    # If this fails, the GitHub Release is already live — the failed
    # workflow flags the problem so it can be addressed before F-Droid's
    # build pipeline runs on the fdroiddata MR.
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install fdroidserver
        run: |
          python3 -m pip install --user fdroidserver

      - name: Install Android NDK 28.2.13676358
        run: yes | sdkmanager --install "ndk;28.2.13676358" > /dev/null

      - name: Set up fdroiddata-style workspace
        run: |
          mkdir -p fdroidcheck/metadata
          cp fdroid/app.mmmap.yml fdroidcheck/metadata/
          cat > fdroidcheck/config.yml <<EOF
          sdk_path: ${ANDROID_HOME}
          ndk_paths:
            "28.2.13676358": ${ANDROID_HOME}/ndk/28.2.13676358
          EOF
          chmod 600 fdroidcheck/config.yml

      - name: Wait for GitHub Release asset to be downloadable
        run: |
          URL="https://github.com/Rozkipz/Mmmap/releases/download/v${{ inputs.version }}/app-release.apk"
          for i in {1..15}; do
            if curl -sfIL "$URL" >/dev/null; then
              echo "Release asset available"
              exit 0
            fi
            echo "Waiting for release asset ($i/15)…"
            sleep 4
          done
          echo "::error::Release asset never became available"
          exit 1

      - name: Run fdroid build (byte-match against published APK)
        working-directory: fdroidcheck
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fdroid build --no-tarball app.mmmap 2>&1 | tee /tmp/build.log
          if ! grep -q "INFO: success: app.mmmap" /tmp/build.log; then
            echo "::error::F-Droid byte-match failed. Inspect log for details."
            grep -iE "integrity check|digest mismatch|Unable to strip|build failed|ERROR" /tmp/build.log || true
            exit 1
          fi
          echo "::notice::Reproducible build verified — F-Droid will produce a byte-matching APK."
