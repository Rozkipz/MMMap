name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Validate version and compute version code
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::version must be MAJOR.MINOR (got '$VERSION')"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 ))" >> $GITHUB_OUTPUT

      - name: Verify build.gradle.kts matches version
        run: |
          KTS_NAME=$(grep -E '^\s+versionName = "[0-9.]+"$' app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          KTS_CODE=$(grep -E '^\s+versionCode = [0-9]+$' app/build.gradle.kts | sed -E 's/.* ([0-9]+)$/\1/')
          if [[ "$KTS_NAME" != "${{ inputs.version }}" || "$KTS_CODE" != "${{ steps.ver.outputs.code }}" ]]; then
            echo "::error::app/build.gradle.kts (${KTS_NAME}/${KTS_CODE}) does not match input (${{ inputs.version }}/${{ steps.ver.outputs.code }}). Run 'just bump-version ${{ inputs.version }}' and commit before triggering this workflow."
            exit 1
          fi

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mmmap-release.jks
          printf 'storeFile=mmmap-release.jks\nstorePassword=%s\nkeyAlias=mmmap\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Assemble release APK
        run: just assemble-release ${{ inputs.version }} ${{ steps.ver.outputs.code }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mmmap-${{ inputs.version }}.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: mmmap-${{ inputs.version }}.apk
          path: app/build/outputs/apk/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just gh-release ${{ inputs.version }} ${{ github.sha }}

