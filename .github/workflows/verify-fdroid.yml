name: Verify F-Droid reproducible build

# Standalone workflow that mirrors what F-Droid's build server does on the
# fdroiddata MR pipeline. Can be triggered manually for any released version
# to confirm the published APK byte-matches a from-source unsigned build.
# Run this BEFORE force-pushing metadata updates to the fdroiddata MR.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify (e.g. 1.3 — must already be published as a GitHub Release)'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (uses HEAD's fdroid/app.mmmap.yml metadata)
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install fdroidserver from master (matches F-Droid CI)
        run: |
          python3 -m pip install --user "git+https://gitlab.com/fdroid/fdroidserver.git@master"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Android NDK 28.2.13676358 (= r28c)
        run: |
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          ls "$ANDROID_HOME/ndk/"

      - name: Clone fdroiddata (partial — same env F-Droid CI uses)
        run: |
          git clone --filter=blob:none --depth=1 https://gitlab.com/fdroid/fdroiddata.git fdroidcheck
          # Override the upstream config.yml with one matching the GH runner's paths.
          cat > fdroidcheck/config.yml <<EOF
          sdk_path: ${ANDROID_HOME}
          ndk_paths:
            r28c: ${ANDROID_HOME}/ndk/28.2.13676358
            "28.2.13676358": ${ANDROID_HOME}/ndk/28.2.13676358
          serverwebroot: /tmp
          gpghome: /tmp
          keystore: /tmp
          keystorepass: x
          keypass: x
          EOF
          chmod 600 fdroidcheck/config.yml
          # Replace the upstream metadata with ours (which references the v1.3 commit).
          cp fdroid/app.mmmap.yml fdroidcheck/metadata/app.mmmap.yml

      - name: Wait for GitHub Release asset
        run: |
          URL="https://github.com/Rozkipz/Mmmap/releases/download/v${{ inputs.version }}/app-release.apk"
          for i in {1..15}; do
            if curl -sfIL "$URL" >/dev/null; then
              echo "Release asset available: $URL"
              exit 0
            fi
            echo "Waiting for release asset ($i/15)…"
            sleep 4
          done
          echo "::error::Release asset never became available at $URL"
          exit 1

      - name: Run fdroid build (byte-match against published APK)
        working-directory: fdroidcheck
        run: |
          set -o pipefail
          fdroid build --no-tarball --verbose app.mmmap 2>&1 | tee /tmp/build.log || true
          if grep -q "INFO: success: app.mmmap" /tmp/build.log; then
            echo "::notice::Reproducible build verified — F-Droid will produce a byte-matching APK."
            exit 0
          fi
          echo "::error::F-Droid byte-match failed. Last 40 lines:"
          tail -40 /tmp/build.log
          exit 1
