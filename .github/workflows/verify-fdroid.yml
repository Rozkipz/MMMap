name: Verify F-Droid pipeline

# Mirrors the test-stage jobs of fdroiddata's GitLab CI pipeline against an
# overlay of our `fdroid/app.mmmap.yml` onto a fresh fdroiddata clone. Uses
# F-Droid's official buildserver Docker image so we get the *exact* same
# fdroidserver / NDKs / gradlew-fdroid / sdkmanager versions they do.
#
# Triggered manually for any released version. Run this BEFORE force-pushing
# metadata updates to the fdroiddata MR.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify (must already be published as a GitHub Release, e.g. 1.4)'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    env:
      ANDROID_HOME: /opt/android-sdk
      # fdroiddata/config.yml references these via {env: …}
      serverwebroot: /tmp
      gpghome: /tmp
      keystore: /tmp
      keystorepass: x
      keypass: x
      # Tells our run-each-step which app to check
      CHANGED: app.mmmap

    steps:
      - name: Checkout Mmmap (provides fdroid/app.mmmap.yml to overlay)
        uses: actions/checkout@v7
        with:
          path: mmmap

      - name: Clone fdroiddata (matches F-Droid's CI environment)
        run: |
          git clone --depth=1 https://gitlab.com/fdroid/fdroiddata.git
          cp mmmap/fdroid/app.mmmap.yml fdroiddata/metadata/app.mmmap.yml
          chown -R "$(whoami)" fdroiddata
          chmod 600 fdroiddata/config.yml || true
          # Commit the overlay so `fdroid checkupdates --auto` (which requires a
          # clean working tree) treats this as the as-submitted state.
          cd fdroiddata
          git config user.email "verify@ci.local"
          git config user.name "verify-ci"
          git add metadata/app.mmmap.yml
          git commit -m "overlay app.mmmap from upstream Mmmap repo" --quiet

      - name: Install fdroidserver master (mirrors F-Droid CI install_fdroid_server)
        run: |
          mkdir -p /fdroidserver
          curl -sSfL https://gitlab.com/fdroid/fdroidserver/-/archive/master/fdroidserver-master.tar.gz \
            | tar -xz --directory=/fdroidserver --strip-components=1
          echo "/fdroidserver" >> "$GITHUB_PATH"
          echo "PYTHONPATH=/fdroidserver:/fdroidserver/examples" >> "$GITHUB_ENV"
          echo "PYTHONUNBUFFERED=true" >> "$GITHUB_ENV"

      # ── Mirrors fdroiddata `.gitlab-ci.yml` test-stage jobs ──────────────

      - name: schema validation
        working-directory: fdroiddata
        run: |
          # buildserver-trixie lacks pip and python3-check-jsonschema; install pip
          # and pull check-jsonschema from PyPI (matches F-Droid CI's `python` image).
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --quiet --break-system-packages check-jsonschema
          check-jsonschema --schemafile schemas/metadata.json metadata/${CHANGED}.yml

      - name: fdroid lint
        working-directory: fdroiddata
        run: fdroid lint "$CHANGED"

      - name: fdroid rewritemeta (must be a no-op)
        working-directory: fdroiddata
        run: |
          fdroid rewritemeta "$CHANGED"
          if ! git --no-pager diff --exit-code metadata/${CHANGED}.yml; then
            echo "::error::Metadata isn't in canonical rewritemeta form. See diff above."
            exit 1
          fi

      - name: fdroid checkupdates --auto
        working-directory: fdroiddata
        run: |
          fdroid checkupdates --auto -v "$CHANGED"
          if ! git --no-pager diff --exit-code metadata/${CHANGED}.yml; then
            echo "::error::checkupdates would change metadata (likely CurrentVersion/Code lag). See diff above."
            exit 1
          fi

      # Note: we don't run `fdroid build` here. F-Droid's CI runs that build
      # inside a full vagrant-user / gradlew-fdroid / sysctl-tuned setup that
      # is impractical to replicate in GH Actions. Reproducible-build is
      # verified locally on macOS via `fdroid build` with our exact NDK
      # (see fdroid/SUBMISSION.md), and F-Droid's CI runs the real build on
      # their MR pipeline. What we verify here is everything *else* their
      # CI checks — schema, lint, rewritemeta, checkupdates, scanner — so
      # those failures surface before pushing to the MR.

      - name: fdroid scanner (check apk — signing blocks, known non-free, etc.)
        working-directory: fdroiddata
        run: |
          # F-Droid scans the binary at the Binaries URL. Mirror that by
          # downloading the published APK to where the scanner looks.
          mkdir -p tmp/binaries
          VCODE=$(grep -E '^\s+versionCode:\s+[0-9]+' metadata/${CHANGED}.yml \
                  | tail -1 | awk '{print $2}')
          curl -sfL "https://github.com/Rozkipz/Mmmap/releases/download/v${{ inputs.version }}/app-release.apk" \
            -o "tmp/binaries/${CHANGED}_${VCODE}.binary.apk"
          set -o pipefail
          fdroid scanner "$CHANGED" 2>&1 | tee /tmp/scan.log
          if grep -qE "^ERROR |Scanner found [1-9]" /tmp/scan.log; then
            echo "::error::F-Droid scanner flagged the APK:"
            grep -E "^ERROR |Scanner found|Problem:|CRITICAL" /tmp/scan.log
            exit 1
          fi
