name: Refresh dataset

# Rebuilds the bundled seed asset from upstream and opens a PR when it changes.
#
# The asset is a ~8 MB binary, so this deliberately opens a PR rather than pushing to
# main: every merge adds another blob to history, and the refresh should land alongside
# a release rather than accumulating between them.
#
# It also short-circuits before downloading anything when the upstream CSV blob SHA
# already matches the committed provenance, so a scheduled run on unchanged data costs
# one API call.

on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour to avoid GitHub's scheduling pile-up.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-dataset
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compare upstream SHA against committed provenance
        id: check
        run: |
          set -euo pipefail
          UPSTREAM=$(curl -sfL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/ngshiheng/michelin-my-maps/contents/data/michelin_my_maps.csv" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          COMMITTED=$(grep -oE 'name="bundled_csv_sha"[^>]*>[0-9a-f]+<' \
            app/src/main/res/values/dataset_provenance.xml \
            | grep -oE '>[0-9a-f]+<' | tr -d '><')
          echo "upstream=$UPSTREAM"
          echo "committed=$COMMITTED"
          if [[ "$UPSTREAM" == "$COMMITTED" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dataset already current ($UPSTREAM) — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$UPSTREAM" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          # seed_db.py uses `str | None` annotations, so 3.10+ is required.
          python-version: '3.12'

      - name: Install just
        if: steps.check.outputs.changed == 'true'
        uses: extractions/setup-just@v4

      # Regenerates the SQLite snapshot, gzips it to michelin.db.seed, and rewrites
      # dataset_provenance.xml with the new blob SHA.
      - name: Regenerate seed asset
        if: steps.check.outputs.changed == 'true'
        run: just seed-db

      - name: Set up JDK 17
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # SeedAssetTest checks gzip magic, the SQLite header, PRAGMA user_version and the
      # provenance SHA — so a truncated or wrongly-shaped asset fails here rather than
      # crashing on a user's first launch.
      - name: Validate the regenerated asset
        if: steps.check.outputs.changed == 'true'
        run: ./gradlew testDebugUnitTest --tests 'app.mmmap.data.db.SeedAssetTest'

      - name: Open or update the refresh PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          BRANCH=chore/refresh-dataset
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- app/src/main/assets app/src/main/res/values/dataset_provenance.xml; then
            echo "::notice::Upstream SHA moved but the generated asset is identical — no PR."
            exit 0
          fi

          ROWS=$(python3 -c "
          import gzip, sqlite3, tempfile, shutil, os
          with gzip.open('app/src/main/assets/michelin.db.seed','rb') as f:
              fd, p = tempfile.mkstemp()
              with os.fdopen(fd,'wb') as o: shutil.copyfileobj(f,o)
          print(sqlite3.connect(p).execute('SELECT COUNT(*) FROM restaurant').fetchone()[0])
          ")

          git checkout -B "$BRANCH"
          git add app/src/main/assets/michelin.db.seed app/src/main/res/values/dataset_provenance.xml
          git commit -m "chore(data): refresh bundled dataset to ${SHA:0:12}

          Regenerated by the refresh-dataset workflow. $ROWS restaurants.

          Merge before cutting a release so fresh installs ship current data — the
          in-app DatasetSyncWorker already keeps existing installs up to date."
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "::notice::Updated existing PR for $BRANCH"
          else
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore(data): refresh bundled dataset ($ROWS restaurants)" \
              --body "Upstream CSV changed to \`$SHA\`.

          Regenerated \`app/src/main/assets/michelin.db.seed\` and \`dataset_provenance.xml\`.
          \`SeedAssetTest\` passed against the new asset.

          This only affects what a **fresh install** shows before its first sync — existing
          installs already pick up upstream changes daily via \`DatasetSyncWorker\`. Merging
          just before a release keeps the binary out of history between releases."
          fi
