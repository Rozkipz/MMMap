name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: just test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run lint
        run: just lint

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run coverage
        run: just coverage

      - name: Generate badge JSON
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, json, os, re

          EXCLUDE_PACKAGES = [
              'app/mmmap/di', 'app/mmmap/data/db/dao', 'app/mmmap/data/db',
              'app/mmmap/data/prefs', 'hilt_aggregated_deps', 'dagger/hilt',
          ]
          EXCLUDE_FILES = re.compile(
              r'(.*Screen|.*Sheet|.*Dialog|Color|Theme|MainActivity|MMMapApplication|Navigation)\.kt$'
          )
          EXCLUDE_CLASSES = re.compile(
              r'.*(Dagger|Hilt_|_HiltModules|_Factory|_MembersInjector|ComposableSingletons'
              r'|_HiltComponents|_GeneratedInjector|_ComponentTreeDeps'
              r'|ScreenKt\$|SheetKt\$|DialogKt\$).*'
          )

          root = ET.parse('app/build/reports/coverage/test/debug/report.xml').getroot()
          missed, covered = 0, 0
          for pkg in root.findall('package'):
              if any(pkg.get('name','').startswith(ex) for ex in EXCLUDE_PACKAGES):
                  continue
              for cls in pkg.findall('class'):
                  src  = cls.get('sourcefilename', '')
                  name = cls.get('name', '')
                  if EXCLUDE_FILES.match(src) or EXCLUDE_CLASSES.match(name):
                      continue
                  for c in cls.findall('counter'):
                      if c.get('type') == 'INSTRUCTION':
                          missed  += int(c.get('missed', 0))
                          covered += int(c.get('covered', 0))

          total = missed + covered
          pct   = round(100 * covered / total) if total else 0
          color = 'brightgreen' if pct >= 80 else 'yellow' if pct >= 60 else 'red'
          os.makedirs('badges', exist_ok=True)
          json.dump(
              {'schemaVersion': 1, 'label': 'coverage', 'message': f'{pct}%', 'color': color},
              open('badges/coverage.json', 'w'),
          )
          print(f'Coverage: {pct}% ({color})')
          EOF

      - name: Commit badge
        uses: EndBug/add-and-commit@v10
        with:
          add: 'badges/coverage.json'
          branch: badges
          create_branch: true
          message: 'chore: update coverage badge [skip ci]'
          default_author: github_actions
